    <path d="M55 12 L61 1 L68 13 Z" fill="#F4C95D"/>
    <path d="M68 10 L78 0 L81 13 Z" fill="#F4C95D"/>
    <path d="M80 12 L91 4 L91 18 Z" fill="#F4C95D"/>

