    <path d="M31 55 C20 48 11 45 4 49 C10 57 19 61 32 62 Z" fill="#D94A4A"/>
    <path d="M32 61 C20 62 11 66 6 73 C17 75 26 72 36 66 Z" fill="#F4C95D"/>
    <path d="M34 66 C25 72 20 79 20 85 C29 83 37 77 43 69 Z" fill="#5C9B69"/>

