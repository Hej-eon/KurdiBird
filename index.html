<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#172b3a" />
    <meta name="description" content="KurdiBird — a Kurdish-inspired arcade flight game." />
    <title>KurdiBird</title>
  </head>
  <body>
    <main id="game-shell" aria-label="KurdiBird game">
      <div id="game"></div>
      <div id="hud" aria-live="polite">
        <div class="hud-score" id="score">0</div>
        <div class="hud-best">BEST <span id="best-score">0</span></div>
        <button id="reset-button" class="reset-button" type="button" aria-label="Restart current flight">↻</button>
      </div>
      <section id="menu" class="overlay-card">
        <p class="eyebrow">KURDISH MOUNTAINS</p>
        <h1>KurdiBird</h1>
        <p class="tagline">Fly free. Fly far.</p>
        <button id="start-button" type="button">Start Flying</button>
        <p class="controls">Space / click / tap to flap</p>
      </section>
      <section id="game-over" class="overlay-card hidden">
        <p class="eyebrow">THE JOURNEY ENDS</p>
        <h2>Nice flight.</h2>
        <div class="results"><span>SCORE</span><strong id="final-score">0</strong></div>
        <div class="results"><span>BEST</span><strong id="final-best">0</strong></div>
        <button id="restart-button" type="button">Fly Again</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
